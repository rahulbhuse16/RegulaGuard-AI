version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance_postgres
    environment:
      POSTGRES_USER: compliance_user
      POSTGRES_PASSWORD: compliance_pass
      POSTGRES_DB: compliance_db
    ports:
      - "5432:5432"
    volumes:
      - compliance_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance_user -d compliance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  compliance_pg_data:
